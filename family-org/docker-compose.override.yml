# docker-compose.override.yml
# Auto-loaded for local development — adds volume mounts for hot-reload
services:
  backend:
    volumes:
      - ./backend/app:/app/app

  worker:
    volumes:
      - ./backend/app:/app/app

  frontend:
    ports:
      - "${FRONTEND_PORT}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules

# backend/ruff.toml
line-length = 120
target-version = "py311"

[lint]
select = ["E", "F", "W", "I", "S", "B", "A", "C4", "UP"]
ignore = [
    "S101",  # allow assert in tests
    "B008",  # Depends() in FastAPI defaults is the standard pattern
    "E712",  # SQLAlchemy column == False/True is correct (not Python bool comparison)
    "E711",  # SQLAlchemy column == None is correct (generates IS NULL)
    "S106",  # token_uri is not a hardcoded password
    "B904",  # FastAPI HTTPException re-raise pattern
    "E402",  # module-level imports after code (FastAPI router pattern)
    "E501",  # line too long (inline CSS/HTML templates exceed 120 chars)
]

[format]
quote-style = "double"
